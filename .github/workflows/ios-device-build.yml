name: HomeClock iOS device build (jailbreak)

# Builds a real arm64 HomeClock.app for iphoneos (NOT simulator), signs it
# ad-hoc with ldid, packages it as a rootless Dopamine .deb and uploads
# artifacts. No Apple Developer account, no secrets, no App Store signing.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "apps/ipad/**"
      - "packages/shared/**"
      - ".github/workflows/ios-device-build.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep -i xcode || true

      - name: Select Xcode 26 (iPadOS 26 SDK, AlarmKit)
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 found; iPadOS 26 SDK / AlarmKit unavailable"
            exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          SDKVER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK version: $SDKVER"
          MAJOR=${SDKVER%%.*}
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "::error::iPadOS 26 SDK required, found $SDKVER"
            exit 1
          fi

      - name: Verify AlarmKit framework exists in SDK
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK path: $SDK"
          echo "--- locate AlarmKit ---"
          find "$SDK" -name "AlarmKit*" 2>/dev/null | head -10 || true
          echo "--- compile test (definitive) ---"
          echo 'import AlarmKit; import Foundation; print("AlarmKit import OK")' | \
            xcrun -sdk "$SDK" swift -target arm64-apple-ios26.0 -
          echo "AlarmKit compiles against iphoneos SDK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build shared package
        working-directory: packages/shared
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install iPad app dependencies
        working-directory: apps/ipad
        run: npm install --no-audit --no-fund

      - name: TypeScript check (iPad)
        working-directory: apps/ipad
        run: npx tsc --noEmit

      - name: Expo prebuild (generates ios/ with autolinked native module)
        working-directory: apps/ipad
        run: |
          npx expo prebuild --platform ios --no-install
          echo "--- ios dir ---"
          ls ios
          echo "--- alarm module linked? ---"
          grep -R "homeclock-alarm" ios/Podfile.properties.json ios/Pods/autolinking.json 2>/dev/null || \
            find ios -name "HomeclockAlarm*" | head -5

      - name: CocoaPods install
        working-directory: apps/ipad/ios
        run: pod install --repo-update

      - name: Build HomeClock.app (iphoneos arm64, unsigned)
        working-directory: apps/ipad/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace HomeClock.xcworkspace \
            -scheme HomeClock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || true
          APP=build/Build/Products/Release-iphoneos/HomeClock.app
          if [ ! -d "$APP" ]; then
            echo "=== BUILD FAILED: error lines ==="
            grep -nE "error:|Error:|fatal|BUILD FAILED" build/xcodebuild.log | tail -40 || true
            echo "=== last 80 lines ==="
            tail -80 build/xcodebuild.log || true
            exit 1
          fi
          echo "--- binary ---"
          file "$APP/HomeClock"
          lipo -info "$APP/HomeClock"

      - name: Embed dynamic pod frameworks (manual, deterministic)
        run: |
          set -uo pipefail
          APP=apps/ipad/ios/build/Build/Products/Release-iphoneos/HomeClock.app
          BUILT=apps/ipad/ios/build/Build/Products/Release-iphoneos
          mkdir -p "$APP/Frameworks"
          echo "=== required dylibs ==="
          otool -L "$APP/HomeClock" | grep "@rpath" | awk '{print $1}' | while read -r d; do
            echo "$d"
          done
          echo "=== A) copy built frameworks from build tree ==="
          find apps/ipad/ios/build -type d -name "*.framework" 2>/dev/null | while IFS= read -r fw; do
            name=$(basename "$fw")
            if [ ! -e "$APP/Frameworks/$name" ]; then
              cp -R "$fw" "$APP/Frameworks/" 2>/dev/null || true
            fi
          done
          echo "=== B) copy ios-arm64 slices from vendored xcframeworks in Pods ==="
          find apps/ipad/ios/Pods -type d -name "*.xcframework" 2>/dev/null | while IFS= read -r xf; do
            find "$xf" -type d -name "*.framework" -path "*ios-arm64*" 2>/dev/null | grep -v simulator | while IFS= read -r fw; do
              name=$(basename "$fw")
              if [ ! -e "$APP/Frameworks/$name" ]; then
                echo "embed $name"
                cp -R "$fw" "$APP/Frameworks/" 2>/dev/null || true
              fi
            done
          done
          echo "=== embed JS bundle ==="
          # RN's bundelfase schrijft main.jsbundle naast de app (leeg
          # UNLOCALIZED_RESOURCES_FOLDER_PATH) — kopieer hem erin.
          if [ -f "$BUILT/main.jsbundle" ]; then
            echo "pipeline bundle: $(stat -f%z "$BUILT/main.jsbundle") bytes"
            cp "$BUILT/main.jsbundle" "$APP/main.jsbundle"
          elif [ ! -f "$APP/main.jsbundle" ]; then
            echo "::error::No JS bundle produced by pipeline nor present in app"
            exit 1
          fi
          ls -la "$APP/main.jsbundle"
          echo "=== embedded now ==="
          ls "$APP/Frameworks"
          echo "=== still missing? ==="
          otool -L "$APP/HomeClock" | grep "@rpath" | awk '{print $1}' | while read -r d; do
            fw=$(basename "$d" | cut -d/ -f1)
            [ -e "$APP/Frameworks/$fw" ] || echo "MISSING: $fw"
          done
          echo "=== count ==="
          ls "$APP/Frameworks" | wc -l

      - name: Upload raw xcodebuild log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: apps/ipad/ios/build/xcodebuild.log
          if-no-files-found: ignore

      - name: Ad-hoc sign with ldid (no-container entitlement on main binary)
        run: |
          set -euo pipefail
          brew install ldid
          APP=apps/ipad/ios/build/Build/Products/Release-iphoneos/HomeClock.app
          # Dopamine/rootless: geen sandbox-container -> app mag schrijven waar
          # mobile mag schrijven (fixt NSCocoaErrorDomain 513 EPERM).
          cat > /tmp/no-container.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.private.security.no-container</key>
            <true/>
          </dict>
          </plist>
          EOF
          find "$APP" -type f \( -name "*.dylib" -o -path "*.framework/*" \) | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              ldid -S "$f"
            fi
          done
          ldid -S/tmp/no-container.plist "$APP/HomeClock"
          echo "--- signature check ---"
          ldid -e "$APP/HomeClock" || true
          codesign -dv "$APP/HomeClock" 2>&1 | head -5 || true

      - name: Package rootless .deb (/var/jb/Applications)
        run: |
          set -euo pipefail
          VERSION=1.0.0
          PKGDIR=dist/homeclock_${VERSION}_iphoneos-arm64
          mkdir -p "$PKGDIR/DEBIAN" "$PKGDIR/var/jb/Applications"
          cp -R apps/ipad/ios/build/Build/Products/Release-iphoneos/HomeClock.app \
                "$PKGDIR/var/jb/Applications/"
          cat > "$PKGDIR/DEBIAN/control" <<EOF
          Package: nl.krimson.homeclock
          Name: HomeClock
          Version: ${VERSION}
          Architecture: iphoneos-arm64
          Description: iPad bedside alarm clock + school dashboard (tailnet-only bossp backend)
          Maintainer: HomeClock Build <homeclock@bossp.local>
          Author: HomeClock
          Section: Utilities
          Priority: optional
          EOF
          # no postinst scripts needed; uicache is run by deploy tooling
          # deterministic Debian ar archive (macOS ar may add BSD-specific members)
          COPYFILE_DISABLE=1 tar czf control.tar.gz -C "$PKGDIR/DEBIAN" .
          COPYFILE_DISABLE=1 tar czf data.tar.gz -C "$PKGDIR" var
          python3 - <<'PY'
          members = [
              ("debian-binary", b"2.0\n"),
              ("control.tar.gz", open("control.tar.gz", "rb").read()),
              ("data.tar.gz", open("data.tar.gz", "rb").read()),
          ]
          with open("nl.krimson.homeclock.deb", "wb") as deb:
              deb.write(b"!<arch>\n")
              for name, data in members:
                  # ar header: name(16) date(12) uid(6) gid(6) mode(8) size(10) magic(2)
                  header = "{:<16}{:<12}{:<6}{:<6}{:<8}{:<10}{:<2}".format(
                      name + "/", "0", "0", "0", "100644", str(len(data)), "`\n"
                  ).encode()
                  assert len(header) == 60, len(header)
                  deb.write(header)
                  deb.write(data)
                  if len(data) % 2:
                      deb.write(b"\n")
          # verify structure
          with open("nl.krimson.homeclock.deb", "rb") as f:
              assert f.read(8) == b"!<arch>\n"
              names = []
              while True:
                  hdr = f.read(60)
                  if len(hdr) < 60:
                      break
                  name = hdr[0:16].decode().rstrip(" /").rstrip("/")
                  size = int(hdr[48:58].decode().strip())
                  f.seek(size + (size % 2), 1)
                  names.append(name)
              print("deb members:", names)
              assert names == ["debian-binary", "control.tar.gz", "data.tar.gz"], names
          print("deb structure OK")
          PY
          rm -f control.tar.gz data.tar.gz
          ls -la nl.krimson.homeclock.deb

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APP=apps/ipad/ios/build/Build/Products/Release-iphoneos/HomeClock.app
          COPYFILE_DISABLE=1 tar czf artifacts/HomeClock-app.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          mv nl.krimson.homeclock.deb artifacts/ 2>/dev/null || true
          {
            echo "commit: $GITHUB_SHA"
            echo "xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "sdk: $(xcrun --sdk iphoneos --show-sdk-version)"
            echo "arch: $(lipo -info apps/ipad/ios/build/Build/Products/Release-iphoneos/HomeClock.app/HomeClock 2>&1)"
          } > artifacts/build-metadata.txt
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homeclock-ios-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
